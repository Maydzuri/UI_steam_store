name: Run Tests and Publish Allure Report

on:
  push:
    branches: [ ci-cd ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Ruff
      run: pip install ruff

    - name: Run Ruff
      run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create .env file
      run: |
        echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
        echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
        echo "POSTGRES_DB_AUTH=${{ secrets.POSTGRES_DB_AUTH }}" >> .env
        echo "POSTGRES_DB_UNIVERSITY=${{ secrets.POSTGRES_DB_UNIVERSITY }}" >> .env
        echo "AUTH_SERVICE_INTERNAL_URL=${{ vars.AUTH_SERVICE_INTERNAL_URL }}" >> .env
        echo "UNIVERSITY_SERVICE_INTERNAL_URL=${{ vars.UNIVERSITY_SERVICE_INTERNAL_URL }}" >> .env
        echo "AUTH_SERVICE_API_URL=${{ vars.AUTH_SERVICE_API_URL }}" >> .env
        echo "UNIVERSITY_SERVICE_API_URL=${{ vars.UNIVERSITY_SERVICE_API_URL }}" >> .env

    - name: Start services
      run: docker compose up -d

    - name: Build test image
      run: docker build -t university-tests .

    - name: Get network name
      id: network
      run: |
        NETWORK_NAME=$(docker network ls --format '{{.Name}}' | grep "_default")
        echo "network_name=${NETWORK_NAME}" >> $GITHUB_OUTPUT

    - name: Wait for API services
      run: |
        docker run --rm \
          --network ${{ steps.network.outputs.network_name }} \
          -v ${{ github.workspace }}:/app \
          university-tests \
          python wait_for_services.py

    - name: Run tests
      run: |
        mkdir -p allure-results
        docker run --rm \
          --network ${{ steps.network.outputs.network_name }} \
          -v ${{ github.workspace }}/allure-results:/app/allure-results \
          -e AUTH_SERVICE_API_URL=${{ vars.AUTH_SERVICE_INTERNAL_URL }} \
          -e UNIVERSITY_SERVICE_API_URL=${{ vars.UNIVERSITY_SERVICE_INTERNAL_URL }} \
          university-tests \
          pytest tests/ -v --alluredir=allure-results

    - name: Stop services
      if: always()
      run: docker compose down

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results

  report:
    runs-on: ubuntu-latest
    needs: test
    if: always() && needs.test.result != 'skipped'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Allure results
      uses: actions/download-artifact@v4
      with:
        name: allure-results
        path: allure-results

    - name: Install Allure CLI
      run: |
        curl -sL https://github.com/allure-framework/allure2/releases/download/2.32.2/allure-2.32.2.tgz -o /tmp/allure.tgz
        tar -xzf /tmp/allure.tgz -C /opt
        sudo ln -s /opt/allure-2.32.2/bin/allure /usr/local/bin/allure

    - name: Generate Allure report
      run: |
        allure generate ./allure-results -o ./allure-report --clean

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./allure-report
        force_orphan: true
