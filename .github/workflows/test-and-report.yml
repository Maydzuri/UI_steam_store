name: Run Tests and Publish Allure Report

on:
  push:
    branches: [ ci-cd ]
  pull_request:
    branches: [ ci-cd ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Ruff
      run: pip install ruff
    - name: Run Ruff
      run: ruff check . || true

    - name: Start services
      run: docker compose up -d

    - name: Wait for PostgreSQL
      run: sleep 10

    - name: Build test image
      run: docker build -t university-tests .

    - name: Wait for services
      run: |
        docker run --rm \
          --network ${GITHUB_WORKSPACE##*/}_default \
          -v ${{ github.workspace }}:/app \
          university-tests \
          python wait_for_services.py

    - name: Run tests
      run: |
        mkdir -p allure-results
        docker run --rm \
          --network ${GITHUB_WORKSPACE##*/}_default \
          -v ${{ github.workspace }}/allure-results:/app/allure-results \
          -e AUTH_SERVICE_API_URL=http://auth:8000 \
          -e UNIVERSITY_SERVICE_API_URL=http://university:8000 \
          university-tests \
          pytest tests/ -v --alluredir=allure-results || true

    - name: Stop services
      if: always()
      run: docker compose down

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results

    - name: Generate Allure report
      if: always()
      run: |
        mkdir -p allure-report
        docker run --rm \
          -v ${{ github.workspace }}/allure-results:/app/allure-results \
          -v ${{ github.workspace }}/allure-report:/app/allure-report \
          university-tests \
          allure generate /app/allure-results -o /app/allure-report --clean || true

    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./allure-report
        force_orphan: true
