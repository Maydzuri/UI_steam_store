name: Run Tests

on:
  push:
    branches: [ ci-cd ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create .env file
      run: |
        echo "POSTGRES_USER=postgres" >> .env
        echo "POSTGRES_PASSWORD=postgres" >> .env
        echo "POSTGRES_DB_AUTH=auth_db" >> .env
        echo "POSTGRES_DB_UNIVERSITY=university_db" >> .env
        echo "AUTH_SERVICE_INTERNAL_URL=http://auth:8000" >> .env
        echo "UNIVERSITY_SERVICE_INTERNAL_URL=http://university:8000" >> .env
        echo "AUTH_SERVICE_API_URL=http://localhost:8888" >> .env
        echo "UNIVERSITY_SERVICE_API_URL=http://localhost:8889" >> .env

    - name: Start services
      run: docker compose up -d

    - name: Wait for PostgreSQL
      run: sleep 15

    - name: Build test image
      run: docker build -t university-tests .

    - name: Get network name
      id: network
      run: |
        NETWORK_NAME=$(docker network ls --format '{{.Name}}' | grep "_default")
        echo "network_name=${NETWORK_NAME}" >> $GITHUB_OUTPUT

    - name: Wait for API services
      run: |
        docker run --rm \
          --network ${{ steps.network.outputs.network_name }} \
          -v ${{ github.workspace }}:/app \
          university-tests \
          python wait_for_services.py

    - name: Run tests
      run: |
        mkdir -p allure-results
        docker run --rm \
          --network ${{ steps.network.outputs.network_name }} \
          -v ${{ github.workspace }}/allure-results:/app/allure-results \
          -e AUTH_SERVICE_API_URL=http://auth:8000 \
          -e UNIVERSITY_SERVICE_API_URL=http://university:8000 \
          university-tests \
          pytest tests/ -v --alluredir=allure-results

    - name: Stop services
      if: always()
      run: docker compose down
